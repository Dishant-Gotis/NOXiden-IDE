[package]
name = "noxiden-core"
version = "0.1.0"
edition = "2021"
authors = ["NOXiden Team"]
description = "Native high-performance indexing, AST symbol extraction, and workspace search engine for NOXiden IDE"
license = "MIT OR Apache-2.0"

[dependencies]
regex = "1.10"
ignore = "0.4"
rayon = "1.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[lib]
crate-type = ["cdylib", "rlib"]

